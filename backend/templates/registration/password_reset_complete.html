{% extends "base.html" %}
{% load static %}

{% block title %}Password Reset Complete — EduGrant{% endblock %}

{% block content %}
<div class="login-container">
  <div class="login-card" style="text-align:center;">
    <div class="logo-container">
      <img src="{% static 'img/edugrant_logo.png' %}" alt="EduGrant Logo" class="logo">
    </div>
    <h2 style="margin-bottom:8px;">Password Updated</h2>
    <p style="color:#6b7280;font-size:14px;margin-bottom:24px;">
      Your password has been successfully reset.<br>
      You can now log in with your new password.
    </p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-login">Log In</a>
  </div>
</div>
{% endblock %}
