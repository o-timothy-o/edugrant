{% extends "base.html" %}
{% load static %}

{% block title %}Reset Link Sent — EduGrant{% endblock %}

{% block content %}
<div class="login-container">
  <div class="login-card" style="text-align:center;">
    <div class="logo-container">
      <img src="{% static 'img/edugrant_logo.png' %}" alt="EduGrant Logo" class="logo">
    </div>
    <h2 style="margin-bottom:8px;">Check your email</h2>
    <p style="color:#6b7280;font-size:14px;margin-bottom:24px;">
      If an account with that email exists, we've sent a password reset link.<br>
      Check your inbox (and spam folder).
    </p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-login">Back to Log In</a>
  </div>
</div>
{% endblock %}
